<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP code</title>
    <link rel="stylesheet" href="OTP(style).css">
</head>
<body>
    <section class="OTP">
        <h1>OTP Code</h1>
        <p>Please enter your information in order to login into your account</p>
        <form action="verify-OTP" method="POST">
            <input type="text" name="otp-1" maxlength="1" required>
            <input type="text" name="otp-2" maxlength="1" required>
            <input type="text" name="otp-3" maxlength="1" required>
            <input type="text" name="otp-4" maxlength="1" required>
            <input type="text" name="otp-5" maxlength="1" required>
            <button type="submit"><a href="Change_Password.html">Confirm</a></button>
        </form>
        <div class="bottom"><p> <a href="Forgot_Password.html">Resend</a></p></div>

    </section>


</body>
</html>
